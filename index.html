<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Figma Store - Merch Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Schoolbell&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="header">
      <div class="search-bar" id="searchBar">
        <div class="search-container">
          <input
            type="text"
            placeholder="Search"
            class="search-input"
            id="searchInput"
            autofocus
          />
          <button class="search-close-btn" id="searchCloseBtn">
            <i class="bx bx-x"></i>
          </button>
        </div>
      </div>
      <div class="container">
        <nav class="nav">
          <div class="nav-left">
            <button class="nav-btn">SHOP ALL</button>
            <button class="nav-btn">ABOUT</button>
            <button class="search-btn" id="searchBtn">
              <i class="bx bx-search"></i>
            </button>
          </div>
          <div class="nav-center">
            <h1 class="site-title">THE FIGMA STORE</h1>
          </div>
          <div class="nav-right">
            <button class="icon-btn">
              <i class="bx bx-user"></i>
            </button>
            <button class="cart-btn">
              CART <span class="cart-count">0</span>
            </button>
          </div>
        </nav>
      </div>
    </header>

    <section class="hero-slider-section">
      <div class="hero-slider" id="heroSlider">
        <div class="hero-slide">
          <img
            src="https://images.pexels.com/photos/8532616/pexels-photo-8532616.jpeg?auto=compress&cs=tinysrgb&w=1200"
            alt="Figma Merch 1"
          />
        </div>
        <div class="hero-slide">
          <img
            src="https://images.pexels.com/photos/3054549/pexels-photo-3054549.jpeg?auto=compress&cs=tinysrgb&w=1200"
            alt="Figma Merch 2"
          />
        </div>
        <div class="hero-slide">
          <img
            src="https://images.pexels.com/photos/2783873/pexels-photo-2783873.jpeg?auto=compress&cs=tinysrgb&w=1200"
            alt="Figma Merch 3"
          />
        </div>
        <div class="hero-slide">
          <img
            src="https://images.pexels.com/photos/1152077/pexels-photo-1152077.jpeg?auto=compress&cs=tinysrgb&w=1200"
            alt="Figma Merch 4"
          />
        </div>
      </div>
      <button class="hero-slider-btn hero-prev" id="heroPrevBtn">
        <i class="bx bx-chevron-left"></i>
      </button>
      <button class="hero-slider-btn hero-next" id="heroNextBtn">
        <i class="bx bx-chevron-right"></i>
      </button>
    </section>

    <section class="filters">
      <div class="container">
        <div class="filter-buttons">
          <button class="filter-btn active" data-filter="all">
            All Products
          </button>
          <button class="filter-btn" data-filter="clothing">Clothing</button>
          <button class="filter-btn" data-filter="accessories">
            Accessories
          </button>
          <button class="filter-btn" data-filter="stickers">Stickers</button>
          <button class="filter-btn" data-filter="pins">Pins</button>
        </div>
      </div>
    </section>

    <section class="products-section">
      <div class="container">
        <div class="products-grid" id="productsGrid"></div>
      </div>
    </section>

    <div class="rotating-circle">
      <svg class="circle-svg" viewBox="0 0 200 200">
        <defs>
          <path
            id="circlePath"
            d="M 100, 100 m -75, 0 a 75,75 0 1,1 150,0 a 75,75 0 1,1 -150,0"
          />
        </defs>
        <text class="circle-text">
          <textPath href="#circlePath">
            FIGMA STORE • SHOP NOW • FIGMA STORE • SHOP NOW •
          </textPath>
        </text>
      </svg>
      <div class="circle-center">
        <i class="bx bx-right-arrow-alt"></i>
      </div>
    </div>

    <footer class="footer">
      <div class="container">
        <div class="footer-content">
          <div class="footer-section">
            <h4>About</h4>
            <p>Exclusive Figma merchandise for designers and creators.</p>
          </div>
          <div class="footer-section">
            <h4>Links</h4>
            <ul>
              <li><a href="#">Shop</a></li>
              <li><a href="#">About</a></li>
              <li><a href="#">Contact</a></li>
              <li><a href="#">FAQ</a></li>
            </ul>
          </div>
          <div class="footer-section">
            <h4>Follow Us</h4>
            <div class="social-links">
              <a href="#"><i class="bx bxl-twitter"></i></a>
              <a href="#"><i class="bx bxl-instagram"></i></a>
              <a href="#"><i class="bx bxl-facebook"></i></a>
            </div>
          </div>
        </div>
        <div class="footer-bottom">
          <p>&copy; 2026 Figma Store. All rights reserved.</p>
        </div>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
